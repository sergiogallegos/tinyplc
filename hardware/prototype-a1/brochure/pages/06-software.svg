<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="297mm" height="210mm" viewBox="0 0 297 210">
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#236d76"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202c34}</style>
<rect width="297" height="210" fill="white"/>
<text x="14" y="13" font-size="2.9" style="fill:#236d76" font-weight="700" text-anchor="start" transform="rotate(0 14 13)">SOFTWARE / STRUCTURED TEXT TO NATIVE ARM CODE</text>
<text x="14" y="28" font-size="6.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 14 28)">Compile on the PC. Execute on the controller.</text>
<path d="M14,198 L283,198" fill="none" stroke="#d8e1e3" stroke-width="0.3" stroke-linecap="round"/>
<text x="14" y="204" font-size="2.3" style="fill:#586872" font-weight="400" text-anchor="start" transform="rotate(0 14 204)">A1 prototype • CAD renders • not a fabrication release • 2026-10-24</text>
<text x="283" y="204" font-size="2.8" style="fill:#586872" font-weight="400" text-anchor="end" transform="rotate(0 283 204)">06</text>
<rect x="14" y="47" width="49" height="38" rx="2" fill="#edf2f2"/>
<text x="18" y="56" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 18 56)">STRUCTURED TEXT</text>
<text x="18" y="64.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 18 64.0)">Write the control program</text>
<path d="M64,66 L68,66" fill="none" stroke="#236d76" stroke-width="0.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="69" y="47" width="49" height="38" rx="2" fill="#edf2f2"/>
<text x="73" y="56" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 73 56)">RUST FRONTEND</text>
<text x="73" y="64.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 73 64.0)">Parse + type-check</text>
<path d="M119,66 L123,66" fill="none" stroke="#236d76" stroke-width="0.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="124" y="47" width="49" height="38" rx="2" fill="#edf2f2"/>
<text x="128" y="56" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 128 56)">LLVM / AOT</text>
<text x="128" y="64.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 128 64.0)">Generate ARM code</text>
<path d="M174,66 L178,66" fill="none" stroke="#236d76" stroke-width="0.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="179" y="47" width="49" height="38" rx="2" fill="#edf2f2"/>
<text x="183" y="56" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 183 56)">PACKAGE</text>
<text x="183" y="64.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 183 64.0)">Validate + stage image</text>
<path d="M229,66 L233,66" fill="none" stroke="#236d76" stroke-width="0.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="234" y="47" width="49" height="38" rx="2" fill="#edf2f2"/>
<text x="238" y="56" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 238 56)">C / FREERTOS</text>
<text x="238" y="64.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 238 64.0)">Scan + execute + commit</text>
<rect x="14" y="99" width="128" height="56" rx="2" fill="#edf2f2"/>
<text x="18" y="108" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 18 108)">IMPLEMENTED ON THE NUCLEO BASELINE</text>
<text x="18" y="116.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 18 116.0)">Native execution, serial download and explicit activation; coherent</text>
<text x="18" y="120.5" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 18 120.5)">monitoring; compatible state migration, trial and rollback; TON on-delay</text>
<text x="18" y="125.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 18 125.0)">timers.</text>
<rect x="155" y="99" width="128" height="56" rx="2" fill="#edf2f2"/>
<text x="159" y="108" font-size="3.5" style="fill:#202c34" font-weight="700" text-anchor="start" transform="rotate(0 159 108)">A1 INTEGRATION STILL TO DO</text>
<text x="159" y="116.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 159 116.0)">Standalone clock and pin setup, four-channel I/O validation, OLED driver and</text>
<text x="159" y="120.5" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 159 120.5)">heartbeat ownership. Native USB and Ethernet are not ready-to-use A1</text>
<text x="159" y="125.0" font-size="3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 159 125.0)">features.</text>
<text x="14" y="168.0" font-size="3.5" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 14 168.0)">The supervisor owns physical I/O and fault handling. User logic runs in a restricted native worker. The UI must consume snapshots at lower</text>
<text x="14" y="173.25" font-size="3.5" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 14 173.25)">priority, with bounded I²C transactions.</text>
<text x="14" y="190" font-size="2.9" style="fill:#586872" font-weight="400" text-anchor="start" transform="rotate(0 14 190)">Target scan period: 10 ms. Existing measured evidence is for NUCLEO-F446RE; A1 timing must be measured separately.</text>
</svg>
