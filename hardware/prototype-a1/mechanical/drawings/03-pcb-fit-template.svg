<text x="170" y="53.95" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 53.95)">(5,5), (115,5), (5,85), (115,85).</text>
<text x="170" y="80.0" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 80.0)">Case offset: +10,+10. DI edge is Y=0. Q and input supply edge is</text>
<text x="170" y="84.95" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 84.95)">Y=90. J1.1 = +24 V; J1.2 = 0 V/GND (−).</text>
<text x="170" y="114.0" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 114.0)">J17 is the internal switch loop. Both contacts carry positive</text>
<text x="170" y="118.95" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 118.95)">supply; neither is ground. D2 RUN at (39,43); D3 PWR at (39,47).</text>
<text x="170" y="147.0" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 147.0)">Cut from card for fit checks. This is not a copper/pad image. A1</text>
<text x="170" y="151.95" font-size="3.3" style="fill:#202c34" font-weight="400" text-anchor="start" transform="rotate(0 170 151.95)">has no routed tracks and is not ready for fabrication.</text>
